<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="He. Photography Portfolio"
    >

    <title>He. | Photography Portfolio</title>

    <style>
        /* ==============================
           BASIC SETTINGS
        ============================== */

        :root {
            --background: #0b0b0d;
            --card: #f8f5ee;
            --card-secondary: #fffaf0;
            --text: #161619;
            --muted: #69676b;
            --accent: #edae35;
            --line: rgba(22, 22, 25, 0.14);
            --shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
            --radius-large: 28px;
            --radius-medium: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--background);
            color: var(--text);
            font-family:
                Inter,
                Avenir,
                "Segoe UI",
                Helvetica,
                Arial,
                sans-serif;
            line-height: 1.5;
            min-height: 100vh;
            transition:
                background 0.3s ease,
                color 0.3s ease;
        }

        button,
        a {
            font: inherit;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            border: none;
            cursor: pointer;
        }

        /* ==============================
           MAIN LAYOUT
        ============================== */

        .page-container {
            width: min(1440px, calc(100% - 48px));
            margin: 0 auto;
            padding: 24px 0 30px;
        }

        .card {
            background: var(--card);
            border-radius: var(--radius-large);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        /* ==============================
           NAVIGATION
        ============================== */

        .navigation {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 58px;
            margin-bottom: 18px;
            color: #f7f4ed;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .logo-dot {
            color: var(--accent);
        }

        .navigation-links {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .navigation-links a {
            color: #97979e;
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 14px;
            transition:
                background 0.25s ease,
                color 0.25s ease;
        }

        .navigation-links a:hover,
        .navigation-links a.active {
            background: #f5f1e8;
            color: #17171a;
        }

        .theme-button {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 15px;
            border-radius: 999px;
            background: #f5f1e8;
            color: #17171a;
            box-shadow: 0 5px 16px rgba(0, 0, 0, 0.2);
        }

        .theme-button span:first-child {
            color: var(--accent);
        }

        /* ==============================
           TOP GRID
        ============================== */

        .top-grid {
            display: grid;
            grid-template-columns: minmax(0, 2.5fr) minmax(280px, 1fr);
            gap: 18px;
            margin-bottom: 18px;
        }

        /* ==============================
           HERO
        ============================== */

        .hero {
            min-height: 385px;
            position: relative;
            display: flex;
            align-items: center;
            padding: 52px 58px;
            background:
                linear-gradient(
                    90deg,
                    rgba(252, 247, 236, 0.98) 0%,
                    rgba(252, 247, 236, 0.92) 36%,
                    rgba(252, 247, 236, 0.18) 72%,
                    rgba(252, 247, 236, 0.05) 100%
                ),
                linear-gradient(
                    135deg,
                    #e8ddd0 0%,
                    #d9c4c2 44%,
                    #8d96a8 70%,
                    #474a51 100%
                );
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 470px;
        }

        .eyebrow {
            margin-bottom: 18px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #57545a;
        }

        .hero h1 {
            font-size: clamp(72px, 10vw, 128px);
            line-height: 0.85;
            letter-spacing: -8px;
            margin-bottom: 26px;
        }

        .hero h1 span {
            color: var(--accent);
        }

        .hero-description {
            max-width: 360px;
            font-size: clamp(20px, 2.1vw, 30px);
            line-height: 1.16;
            letter-spacing: -1px;
            margin-bottom: 30px;
        }

        .hero-photo-label {
            position: absolute;
            right: 28px;
            bottom: 26px;
            z-index: 2;
            color: rgba(255, 255, 255, 0.95);
            background: rgba(0, 0, 0, 0.62);
            backdrop-filter: blur(8px);
            padding: 8px 12px;
            border-radius: 999px;
            font-size: 12px;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 48px;
            padding: 12px 25px;
            border-radius: 999px;
            border: 1px solid #1a191d;
            font-size: 14px;
            font-weight: 600;
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 18px rgba(0, 0, 0, 0.15);
        }

        .button-dark {
            background: #151519;
            color: #fff;
        }

        .button-light {
            background: rgba(255, 255, 255, 0.45);
            color: #17171a;
        }

        /* ==============================
           FEATURED CARD
        ============================== */

        .featured {
            min-height: 385px;
            padding: 30px 28px 24px;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(
                    circle at top right,
                    rgba(255, 217, 139, 0.7),
                    transparent 45%
                ),
                #fff9ec;
        }

        .section-label {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .star {
            color: var(--accent);
            font-size: 18px;
        }

        .featured h2 {
            font-size: 29px;
            letter-spacing: -1px;
            margin-bottom: 3px;
        }

        .featured-description {
            color: var(--muted);
            margin-bottom: 18px;
        }

        .featured-image {
            position: relative;
            flex: 1;
            min-height: 215px;
            border-radius: 21px;
            background:
                linear-gradient(
                    145deg,
                    rgba(255, 196, 97, 0.65),
                    rgba(123, 87, 91, 0.4)
                ),
                #d9ba89;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(35, 30, 25, 0.7);
            border: 1px dashed rgba(35, 30, 25, 0.25);
            overflow: hidden;
        }

        .image-placeholder-text {
            padding: 12px 16px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.76);
            backdrop-filter: blur(8px);
            font-size: 13px;
            font-weight: 700;
            text-align: center;
        }

        .round-button {
            position: absolute;
            right: 16px;
            bottom: 16px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #fff;
            color: #111;
            display: grid;
            place-items: center;
            font-size: 19px;
            transition: transform 0.2s ease;
        }

        .round-button:hover {
            transform: translateX(3px);
        }

        /* ==============================
           CONTENT GRID
        ============================== */

        .content-grid {
            display: grid;
            grid-template-columns: minmax(0, 2.2fr) minmax(340px, 1fr);
            gap: 18px;
        }

        /* ==============================
           GALLERY
        ============================== */

        .gallery-section {
